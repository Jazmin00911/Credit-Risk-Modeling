[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditrisk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "scipy", "scikit-learn", "xgboost", "shap", "joblib", "matplotlib", "streamlit"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 125
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702"]
"src/creditrisk/validate.py" = ["E501", "E702"]  # dense test battery, kept compact

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
